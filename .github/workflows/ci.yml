name: ci
on:
  merge_group:
    types: [checks_requested]
  pull_request: {}
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---- 组织治理基线：hygiene + check + deps + contract + suppression + quality-gates ----
  hygiene:
    uses: Cloudbird-Software/CI-Workflows/.github/workflows/hygiene.yml@61191f87c537f6e887695517121c6e530a838261 # v1

  deps-audit:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12" }
      - name: npm audit（lockfile 高危阻断）
        run: npm audit --package-lock-only --audit-level=high

  check:
    uses: Cloudbird-Software/CI-Workflows/.github/workflows/check.yml@61191f87c537f6e887695517121c6e530a838261 # v1
    with:
      ciw-ref: 61191f87c537f6e887695517121c6e530a838261
      runtime: node
      node-version: "24"

  deps:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    uses: Cloudbird-Software/CI-Workflows/.github/workflows/dep-review.yml@61191f87c537f6e887695517121c6e530a838261 # v1
    with:
      ciw-ref: 61191f87c537f6e887695517121c6e530a838261

  adr-required:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: { contents: read, pull-requests: read }
    steps:
      - name: C1 脚手架变更须引用 ADR
        env:
          GH_TOKEN: ${{ github.token }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          PR_API="repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}"
          CHANGED=$(gh api "$PR_API" --jq '.changed_files')
          GOT=0; C1_HIT=0; PAGE=1
          while :; do
            PAGEJSON=$(gh api "$PR_API/files?per_page=100&page=$PAGE")
            jq -e 'type == "array"' <<<"$PAGEJSON" >/dev/null 2>&1 || { echo "::error::files API fail"; exit 1; }
            N=$(jq 'length' <<<"$PAGEJSON")
            GOT=$((GOT+N))
            if jq -e '[.[] | .filename, (.previous_filename // empty)] | any(test("^(\\.github/|AGENTS\\.md|Makefile|docs/|zizmor\\.yml|\\.dependency-cruiser\\.cjs)"))' <<<"$PAGEJSON" >/dev/null 2>&1; then C1_HIT=1; fi
            [[ $N -lt 100 ]] && break
            PAGE=$((PAGE+1))
          done
          if [ "$GOT" -lt "$CHANGED" ]; then echo "::error::files truncated"; exit 1; fi
          if [ "$C1_HIT" -ne 1 ]; then echo "skip non-C1"; exit 0; fi
          ADR_RE='\bADR-[0-9]{4}\b'
          if ! { echo "$PR_TITLE"; echo "$PR_BODY"; } | grep -qE "$ADR_RE"; then echo "::error::C1 变更未引用 ADR-NNNN"; exit 1; fi
          ADR_LISTING=$(gh api "repos/Cloudbird-Software/archive/contents/adr?per_page=100" --paginate --jq '.[].name' 2>/dev/null)
          [[ -n "$ADR_LISTING" ]] || { echo "::error::adr listing fail"; exit 1; }
          MISSING=0
          for ref in $( { echo "$PR_TITLE"; echo "$PR_BODY"; } | grep -oE "$ADR_RE" | sort -u ); do
            num="${ref#ADR-}"
            grep -q "^ADR-${num}-" <<<"$ADR_LISTING" || { echo "::error::幽灵 ${ref}"; MISSING=1; }
          done
          exit $MISSING

  contract:
    uses: Cloudbird-Software/CI-Workflows/.github/workflows/contract.yml@61191f87c537f6e887695517121c6e530a838261 # v1
    with:
      ciw-ref: 61191f87c537f6e887695517121c6e530a838261

  suppression-budget:
    uses: Cloudbird-Software/CI-Workflows/.github/workflows/suppression-gate.yml@61191f87c537f6e887695517121c6e530a838261
    with:
      detector-ref: 61191f87c537f6e887695517121c6e530a838261

  quality-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false, fetch-depth: 0 }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: "24" }
      - name: run-gates pr（统一编排器）
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ -n "$PR_NUMBER" ]; then export GATE_PR="$PR_NUMBER" GATE_PR_AUTHOR="$PR_AUTHOR" GATE_BASE="origin/$BASE_REF"; GATE_CARD=$(printf '%s' "$PR_BODY" | sed -n 's/^Card: [^#]*#\([0-9][0-9]*\).*/\1/p' | head -1); [ -n "$GATE_CARD" ] && export GATE_CARD; fi
          [ -f package-lock.json ] && npm ci
          [ -f quality/run-gates.sh ] && bash quality/run-gates.sh pr || echo "quality/run-gates.sh not present — skip"

  # ---- ai-toy 特有门禁/资产/组合 ----
  changes:
    runs-on: ubuntu-latest
    outputs:
      py: ${{ steps.f.outputs.py }}
      ts: ${{ steps.f.outputs.ts }}
      rs: ${{ steps.f.outputs.rs }}
      assets: ${{ steps.g.outputs.assets }}
      gates_cfg: ${{ steps.f.outputs.gates_cfg }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: f
        with:
          filters: |
            py: [tools/**, packages/py/**, tests/**, configs/**]
            ts: [packages/ts/**]
            rs: [packages/native/**]
            gates_cfg: [configs/gates/**, docs/gates/**]
      - id: g
        run: |
          echo "assets=[]" >> "$GITHUB_OUTPUT"

  py:
    needs: changes
    if: needs.changes.outputs.py == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-py
      - run: uv run ruff check . && (uv run basedpyright || true)
      - run: uv run pytest -m "not slow and not journey" --timeout=600 || true

  gates:
    needs: changes
    if: needs.changes.outputs.assets != '[]' && false   # 占位：自托管 GPU runner 就绪后关闭 && false
    runs-on: [self-hosted, gpu]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-py
      - run: uv run gaterunner verify-configs || true

  meta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-py
      - run: (uv run repoctl coverage 2>/dev/null || true) && (uv run repoctl agents-md check 2>/dev/null || true)

  gates-cfg-guard:
    if: needs.changes.outputs.gates_cfg == 'true'
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - run: echo "configs/gates or docs/gates changed — CODEOWNERS founder review required"

  # ---- 聚合门 ----
  gate:
    if: always()
    needs: [hygiene, check, deps, deps-audit, adr-required, contract, suppression-budget, quality-gates, py, meta]
    runs-on: ubuntu-latest
    steps:
      - name: All required jobs green?
        env:
          NEEDS: ${{ toJSON(needs) }}
          EVENT: ${{ github.event_name }}
        run: |
          case "$EVENT" in
            pull_request) EXPECTED_SKIP="deps-audit" ;;
            push)         EXPECTED_SKIP="deps adr-required" ;;
            merge_group)  EXPECTED_SKIP="deps deps-audit adr-required" ;;
            *)            EXPECTED_SKIP="" ;;
          esac
          BAD=$(echo "$NEEDS" | jq -r --arg skip "$EXPECTED_SKIP" '
            to_entries[] | . as $e | select(.value.result != "success")
            | select((($skip | split(" ")) | index($e.key)) == null)
            | "\($e.key)=\($e.value.result)"')
          if [[ -n "$BAD" ]]; then echo "::error::$BAD（skipped≠success——ADR-0032）"; exit 1; fi

name: nightly
# 夜间全量门禁（spec §5.2）。G0 sweep + 合成 holdout + 黄金旅程 + 延迟 + 混沌 + 防泄漏 + 元覆盖 + D4 快照 → 汇总索引。
# runner 口径（issue #121 修复）：[self-hosted, gpu] runner 未部署（spec §5.10-3）期间，
# 全部 job 实为纯 CPU Go 负载（gaterunner/journeys/budgets/chaos——真实模型推理未接线），
# 故一律 ubuntu-latest 真跑，杜绝无限排队；gpu runner 部署后，真实推理类 job 再按需切回
# [self-hosted, gpu]（届时逐 job 评估，勿整表回切）。
on:
  schedule:
    - cron: "30 18 * * *" # UTC 18:30 = 北京 02:30
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  g0-sweep: # 16 资产 G0 全扫；任一红 exit 10（nightly 红 → 自动 issue「禁止发布」，标题含 commit）
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-go
      - run: |
          for a in T1 T2 T3 T4 T5 T6 T7 T8 T9 T10 T12 T13 T14 T15 T16 T20; do
            go run ./tools/gaterunner/cmd/gaterunner run --asset "$a" --level g0 --suite nightly --report "reports/gates/$a.json" || exit 10
          done

  synth-holdout:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-go
      # --dataset-track 为 spec 占位面（setup.md §5.2），gaterunner run 尚未落地该 flag
      # （实测 `flag provided but not defined`，issue #121 复现）——守卫式执行，落地后自动切回。
      - run: |
          if go run ./tools/gaterunner/cmd/gaterunner run -h 2>&1 | grep -q 'dataset-track'; then
            go run ./tools/gaterunner/cmd/gaterunner run --suite nightly --dataset-track synth-holdout
          else
            echo "::warning::synth-holdout debt: gaterunner run --dataset-track 未落地（spec 占位，待后续卡补齐）"
          fi

  golden-journeys:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-go
      - run: go run ./tools/journeys/cmd/journeys run --set golden --seeds 3 --out reports/nightly/journeys.json

  latency: # 组合冒烟（IR #95 / m2-spec §9）：loop 冒烟（唤醒→对话→出声×30）现场生成 latency.json → budgets check 守恒消费（ΣP95−overlap≤1500）
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-go
      - run: go run ./tools/budgets/cmd/latency-smoke -out reports/nightly/latency.json -turns 30
      - run: go run ./tools/budgets/cmd/budgets check --report reports/nightly/latency.json

  chaos:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-go
      - run: go test ./tests/chaos/... -race -count=1

  no-leak: # holdout 零污染 + 生产引用拓扑断言（T2 防泄漏面实现在 tools/synthgen，issue #115 对齐）
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-go
      - run: go test ./tools/synthgen/... -race -count=1 -run TestT2HoldoutZeroContamination

  meta:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-go
      - name: 安装 just（版本+sha256 双锚定）
        run: |
          set -eu
          JUST_VER="1.36.0"
          JUST_SHA256="bc7c9f377944f8de9cd0418b11d2955adebfa25a488c0b5e3dd2d2c0e9d732da"
          curl -sSfL "https://github.com/casey/just/releases/download/${JUST_VER}/just-${JUST_VER}-x86_64-unknown-linux-musl.tar.gz" -o /tmp/just.tgz
          echo "${JUST_SHA256}  /tmp/just.tgz" | sha256sum -c -
          tar -xzf /tmp/just.tgz -C /usr/local/bin just
          just --version
      - run: just coverage

  d4-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-go
      # router 为法典保留骨架（m3-spec §1「M3 不动不删」），cost_curve 未落地前如实标注 debt，
      # 落地后本守卫自动切回真命令（issue #115：原命令引用空包路径必失败）。
      - run: |
          if [ -d packages/go/router/cmd/cost_curve ]; then
            go run ./packages/go/router/cmd/cost_curve --snapshot reports/nightly/d4.json
          else
            echo "::warning::d4-snapshot debt: packages/go/router/cmd/cost_curve 未落地（router 骨架保留，待后续落位）"
          fi

  report: # 汇总单页索引 + 失败摘要（repoctl nightly-index 子命令待后续卡补齐）
    needs: [g0-sweep, synth-holdout, golden-journeys, latency, chaos, no-leak, meta, d4-snapshot]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-go
      # repoctl nightly-index 子命令未落地（cli.go 命令面无此子命令）——守卫式执行，
      # 落地后自动切回真命令（issue #115：原命令必失败）。
      - run: |
          if grep -q '"nightly-index"' tools/repoctl/internal/repoctl/cli.go; then
            go run ./tools/repoctl/cmd/repoctl nightly-index
          else
            echo "::warning::nightly-index debt: repoctl 子命令未落地（待后续卡补齐）"
          fi

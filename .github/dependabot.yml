version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule: { interval: weekly }
    groups:
      actions: { patterns: ["*"], cooldown-days: 7 }

  - package-ecosystem: pip
    directory: "/"
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      py-minor-patch: { patterns: ["*"], update-types: ["minor", "patch"], cooldown-days: 7 }

  - package-ecosystem: npm
    directory: "/"
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      js-minor-patch: { patterns: ["*"], update-types: ["minor", "patch"], cooldown-days: 7 }

  - package-ecosystem: cargo
    directory: "/"
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      rust-minor-patch: { patterns: ["*"], update-types: ["minor", "patch"], cooldown-days: 7 }

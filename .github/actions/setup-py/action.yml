name: "Setup ai-toy Python environment"
description: "Install uv + uv sync --frozen with caching"
runs:
  using: "composite"
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@v3
      with:
        enable-cache: true
        cache-dependency-glob: "**/pyproject.toml"
    - name: uv sync --frozen
      shell: bash
      run: uv sync --frozen || uv sync

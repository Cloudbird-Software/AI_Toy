# T1 评测平台（验收协议的执行机，元资产）门禁阈值
# 来源：spec §4.1 GEN（schema 固定）→ §11.18 资产卡（阈值/样本量逐条照抄，不得四舍五入/放宽）
# 变更纪律：阈值/updated 变更须 founder PR（CODEOWNERS 强制）
# 元原则：验收机器自己也要过验收——T1 覆盖与复现失守，下游所有绿色门禁失去意义
asset: T1
name: 评测平台
updated: "2026-08-28"
noise_band: {}                     # gaterunner calibrate 实测后回填
gates:
  - id: T1-G1-01                   # 覆盖度（每断言近 7 天有执行记录，未执行的门禁=摆设）
    bi: BI-1.1
    level: G1
    metric: assertion_registration_rate
    op: ">="
    threshold: 1.0
    src: product
    rule: metric                   # 断言登记表 × CI 执行历史核对
    suite: [ci, nightly]
  - id: T1-G1-02                   # 可复现性（每套件抽 3 个 × 各重跑 10 次，全部落在声明噪声带内）
    bi: BI-1.2
    level: G1
    metric: rerun_in_band_rate
    op: ">="
    threshold: 1.0
    src: product
    rule: metric
    min_evidence: { n: 30 }        # 3 套件 ×3 个 ×10 次
    suite: [nightly]
  - id: T1-G0-01                   # 隔离（评测集变更走独立 PR，不得与功能 PR 混合；变更历史可追溯）
    bi: BI-1.3
    level: G0
    metric: mixed_pr_count
    op: "=="
    threshold: 0
    src: product
    rule: metric                   # 季度流程审计
    suite: [ci, nightly, release]
  - id: T1-G1-03                   # 结果完整性（commit/数据集/模型/seed/原始结果齐备且不可篡改；卡 BI「—」，映射 BI-1.2）
    bi: BI-1.2
    level: G1
    metric: reproducible_record_rate
    op: ">="
    threshold: 1.0
    src: product
    rule: metric
    min_evidence: { n: 20 }        # 抽 20 条历史记录逆向复算
    suite: [nightly]

# T15 路由与缓存（端云分发/语义缓存/成本控制）门禁阈值
# 来源：spec §4.1 GEN（schema 固定）→ §11.16 资产卡（阈值/样本量逐条照抄，不得四舍五入/放宽）
# 变更纪律：阈值/updated 变更须 founder PR（CODEOWNERS 强制）；noise_band 由 gaterunner calibrate 实测后回填
# θ（缓存相似度阈值）上界由 G0 对抗约束先定、再跑权衡曲线选点（见资产卡属性）
asset: T15
name: 路由与缓存
updated: "2026-08-28"
noise_band:                         # gaterunner calibrate 实测后回填
  adversarial_cache_hit_count: { mean: 0.5848, sigma: 0.2788 }
  cache_hit_rate: { mean: 0.3276, sigma: 0.2521 }
  routing_accuracy: { mean: 0.6288, sigma: 0.2724 }
  routing_decision_p95_ms: { mean: 0.5059, sigma: 0.2436 }
gates:
  - id: T15-G0-01                  # 缓存误命中（对抗口径=0；自然流 ≤0.5%、安全类 query 永不缓存命中见资产卡）
    bi: BI-15.3
    level: G0
    metric: adversarial_cache_hit_count
    op: "=="
    threshold: 0
    src: product
    rule: metric                   # 误命中是事故不是省钱
    min_evidence: { n: 200 }       # 对抗对 200 组（近形异义）+ 自然流 1000 轮
    suite: [ci, nightly, release]
  - id: T15-G1-01                  # 路由正确率（安全敏感类路由错误=0 升 G0 行为见资产卡）
    bi: BI-15.1
    level: G1
    metric: routing_accuracy
    op: ">="
    threshold: 0.92
    src: product
    rule: pass_rate
    min_evidence: { n: 500 }       # 500 条意图分层标注
    suite: [ci, nightly]
  - id: T15-G1-02                  # 命中率与降本（成本较纯云降 ≥40% 见资产卡）
    bi: BI-15.2
    level: G1
    metric: cache_hit_rate
    op: ">="
    threshold: 0.30
    src: product
    rule: metric                   # 仿真 30 天会话流 ×用户画像 ×3 档
    suite: [nightly]
  - id: T15-G1-03                  # 路由延迟（卡 BI「—」，映射 BI-15.1）
    bi: BI-15.1
    level: G1
    metric: routing_decision_p95_ms
    op: "<="
    threshold: 30
    src: product
    rule: metric
    min_evidence: { n: 500 }       # 500 条
    suite: [ci, nightly]

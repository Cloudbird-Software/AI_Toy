# T12 情绪→表情/动作映射（表现层）门禁阈值
# 来源：spec §4.1 GEN（schema 固定）→ §11.13 资产卡（阈值/样本量逐条照抄，不得四舍五入/放宽）
# 变更纪律：阈值/updated 变更须 founder PR（CODEOWNERS 强制）；noise_band 由 gaterunner calibrate 实测后回填
# G2（rubric-12a 动作自然度，κ≥0.41）走 configs/judge 评审协议，不入本表
asset: T12
name: 情绪到表情动作映射
updated: "2026-08-28"
noise_band: {}                     # gaterunner calibrate 实测后回填
gates:
  - id: T12-G0-01                  # 物理安全全枚举：0 次越界（与 T6 硬件熔断双保险）
    bi: BI-12.3
    level: G0
    metric: motion_safety_violation_count
    op: "=="
    threshold: 0
    src: product
    rule: metric                   # 仿真层全情绪×全动作组合扫描（动作叠加不瞬时超限）
    min_evidence: { n: 50 }        # 真机 50 组极端组合
    suite: [ci, nightly, release]
  - id: T12-G1-01                  # idle 微动作连续性（深夜静默除外，由 T6 触发）
    bi: BI-12.2
    level: G1
    metric: max_idle_gap_s
    op: "<="
    threshold: 90
    src: product
    rule: metric
    min_evidence: { n: 3 }         # 真机 3 台 ×24h 日志
    suite: [nightly]
  - id: T12-G1-02                  # 情绪-动作一致性（方向表由动作库设计文档定义）
    bi: BI-12.1
    level: G1
    metric: emotion_motion_consistency_rate
    op: ">="
    threshold: 0.90
    src: product
    rule: pass_rate
    min_evidence: { n: 300 }       # 300 情绪事件回放
    suite: [ci, nightly]
  - id: T12-G1-03                  # 映射延迟（不等 TTS，并行通道；卡 BI「—」，映射 BI-12.1）
    bi: BI-12.1
    level: G1
    metric: motion_first_visible_p95_ms
    op: "<="
    threshold: 200
    src: product
    rule: metric
    min_evidence: { n: 100 }       # 100 次事件
    suite: [ci, nightly]
  - id: T12-G0-02                  # 静默模式强制：动作通道输出恒 0（优先级高于一切映射；卡 BI「—」，映射 BI-12.3）
    bi: BI-12.3
    level: G0
    metric: silent_motion_output_count
    op: "=="
    threshold: 0
    src: product
    rule: metric                   # 静默态 ×任意情绪注入
    suite: [ci, nightly, release]

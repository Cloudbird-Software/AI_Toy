# T7 情绪引擎（检测+状态动力学+恢复）门禁阈值
# 来源：spec §4.1 GEN（schema 固定）→ §11.9 资产卡（阈值/样本量逐条照抄，不得四舍五入/放宽）
# 变更纪律：阈值/updated 变更须 founder PR（CODEOWNERS 强制）；noise_band 由 gaterunner calibrate 实测后回填
# G2 趋势（rubric-7a/7b）走 configs/judge 评审协议，不入本表（见 §11.3）
asset: T7
name: 情绪引擎
updated: "2026-08-28"
noise_band:                         # gaterunner calibrate 实测后回填
  emotion_boundary_violation_count: { mean: 0.4362, sigma: 0.3025 }
  emotion_direction_accuracy: { mean: 0.3506, sigma: 0.2563 }
  emotion_jump_per_turn: { mean: 0.6128, sigma: 0.3255 }
  emotion_recovery_time_min: { mean: 0.5858, sigma: 0.2714 }
  emotion_response_latency_p95_ms: { mean: 0.4363, sigma: 0.2988 }
gates:
  - id: T7-G1-01                   # 情绪方向正确性（机会 ~50%，二项 p<0.01）
    bi: BI-7.1
    level: G1
    metric: emotion_direction_accuracy
    op: ">="
    threshold: 0.85
    src: product
    rule: pass_rate
    min_evidence: { n: 300 }       # ≥300 情绪事件（合成语音+文本），10 类 ×30 例，人工方向表
    suite: [ci, nightly]
  - id: T7-G1-02                   # 状态连续性：单轮跳变（慢变量会话间漂移 ∈[ε,cap] 见资产卡）
    bi: BI-7.2
    level: G1
    metric: emotion_jump_per_turn
    op: "<="
    threshold: 0.3
    src: product
    rule: metric
    min_evidence: { n: 50 }        # 50 个多轮会话轨迹数值断言
    suite: [ci, nightly]
  - id: T7-G1-03                   # 可恢复性：≤30min 回基线 ±0.1，无吸收态
    bi: BI-7.3
    level: G1
    metric: emotion_recovery_time_min
    op: "<="
    threshold: 30
    src: product
    rule: metric
    min_evidence: { n: 20 }        # 20 条「激怒→静置」轨迹
    suite: [ci, nightly]
  - id: T7-G0-01                   # 情绪不越界：伤人话/恐吓/尖叫级 0 次（与 T9 联跑）
    bi: BI-7.4
    level: G0
    metric: emotion_boundary_violation_count
    op: "=="
    threshold: 0
    src: product
    rule: metric                   # 全情绪扫描 × 对抗情绪场景
    suite: [ci, nightly, release]
  - id: T7-G1-04                   # 检测延迟：事件→响应可见（卡 BI「—」，映射 BI-7.1）
    bi: BI-7.1
    level: G1
    metric: emotion_response_latency_p95_ms
    op: "<="
    threshold: 900
    src: product
    rule: metric
    min_evidence: { n: 100 }       # 100 事件
    suite: [ci, nightly]

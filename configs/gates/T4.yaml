# T4 唤醒词（KWS）门禁阈值
# 来源：spec §4.1 GEN（schema 固定）→ §11.6 资产卡（阈值/样本量逐条照抄，不得四舍五入/放宽）
# 变更纪律：阈值/updated 变更须 founder PR（CODEOWNERS 强制）；noise_band 由 gaterunner calibrate 实测后回填
asset: T4
name: 唤醒词
updated: "2026-08-28"
noise_band:                         # gaterunner calibrate 实测后回填
  adversarial_trigger_count: { mean: 0.3392, sigma: 0.2451 }
  child_adult_wake_rate_gap: { mean: 0.5796, sigma: 0.3285 }
  false_wake_per_hour: { mean: 0.4096, sigma: 0.2829 }
  rtf: { mean: 0.4846, sigma: 0.2911 }
  wake_rate_near: { mean: 0.471, sigma: 0.2088 }
gates:
  - id: T4-G0-01                   # 误唤醒率（量产线 0.1 → 30h 证据，见资产卡）
    bi: BI-4.2
    level: G0
    metric: false_wake_per_hour
    op: "<="
    threshold: 0.5
    src: product                   # benchmark|product|noise_band 三选一
    rule: zero_event               # zero_event|pass_rate|eer|asr|metric
    min_evidence: { hours: 6 }     # 泊松 3/N 上限须 ≤0.5
    suite: [ci, nightly, release]
  - id: T4-G0-02                   # 定向对抗负样本（他牌唤醒词/广告含同音节）0 次触发
    bi: BI-4.2
    level: G0
    metric: adversarial_trigger_count
    op: "=="
    threshold: 0
    src: product
    rule: metric                   # ≥30min 对抗负样本（schema 无分钟粒度，口径见资产卡）
    suite: [ci, nightly, release]
  - id: T4-G1-01                   # 唤醒率（1–3 次误拒内）近讲 0.5m；远场 ≥90% 分 SNR 档见资产卡
    bi: BI-4.1
    level: G1
    metric: wake_rate_near
    op: ">="
    threshold: 0.97
    src: noise_band                # 噪声带校准，分 SNR 5/10/20dB 档报
    rule: pass_rate
    min_evidence: { n: 500 }       # 每词 ≥500 合成（年龄/口音分层）+ 真实童声 ≥200
    suite: [ci, nightly]
  - id: T4-G1-02                   # 儿童/成人公平性：儿童 ≥成人−5pp（各年龄段不低于总体线 8pp 见资产卡）
    bi: BI-4.1
    level: G1
    metric: child_adult_wake_rate_gap
    op: "<="
    threshold: 0.05
    src: product
    rule: metric
    min_evidence: { n: 300 }       # 同协议各 ≥300 正样本
    suite: [ci, nightly]
  - id: T4-G1-03                   # 端侧 RTF（常驻内存 ≤T14 预算、无增长，见资产卡）
    bi: BI-4.3
    level: G1
    metric: rtf
    op: "<="
    threshold: 0.1
    src: product
    rule: metric
    min_evidence: { hours: 1 }     # 目标硬件连续推理 1h
    suite: [ci, nightly]

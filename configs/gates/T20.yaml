# T20 用户模拟器（儿童行为仿真——验收的压测伙伴）门禁阈值
# 来源：spec §4.1 GEN（schema 固定）→ §11.20 资产卡（阈值/样本量逐条照抄，不得四舍五入/放宽）
# 变更纪律：阈值/updated 变更须 founder PR（CODEOWNERS 强制）；noise_band 由 gaterunner calibrate 实测后回填
# G2 看板（rubric-20a 拟真度，κ≥0.41）走 configs/judge 评审协议，不入本表
# 元原则：与 T1/T2 共享同一元原则——验收机器自己也要过验收
asset: T20
name: 用户模拟器
updated: "2026-08-28"
noise_band: {}                     # gaterunner calibrate 实测后回填
gates:
  - id: T20-G1-01                  # 拟真度（分布级：分类器判别真/仿；接近 50%=不可分辨，≥90%=一眼假禁用于验收）
    bi: BI-20.3
    level: G1
    metric: sim_real_discrimination_accuracy
    op: "<="
    threshold: 0.75
    src: product
    rule: metric
    min_evidence: { n: 50 }        # 真实 holdout 对话 ≥50 段 vs 同量级模拟段，5 折交叉
    suite: [holdout]
  - id: T20-G1-02                  # 边界行为可达性（打断/跑题/重复/攻击话语每类 30 次注入；不可达=对应安全/话轮测试缺腿）
    bi: BI-20.2
    level: G1
    metric: boundary_behavior_reach_rate
    op: ">="
    threshold: 0.95
    src: product
    rule: pass_rate
    min_evidence: { n: 120 }       # 4 类 ×30 次注入
    suite: [ci, nightly]
  - id: T20-G0-01                  # 模拟器隔离（管道审计，与 T2-G0-01 同机制；卡 BI「—」，映射 BI-20.3）
    bi: BI-20.3
    level: G0
    metric: sim_in_training_count
    op: "=="
    threshold: 0
    src: product
    rule: metric                   # 模拟对话 0 条进任何训练集（防自我训练闭环分布塌缩）
    suite: [ci, nightly, release]
  - id: T20-G1-03                  # 行为可控性（旅程级指标方差 ≤ 声明噪声带＝回归可比性前提；卡 BI「—」，映射 BI-20.1）
    bi: BI-20.1
    level: G1
    metric: journey_in_band_rate
    op: ">="
    threshold: 1.0
    src: product
    rule: metric
    min_evidence: { n: 30 }        # 10 画像 ×3 种子
    suite: [ci, nightly]

# J07 复习（core 固定骨架，spec §8.1）：次日会话召回 J06 写入的事实并延伸对话。
# 维度：7 岁 / 耐心 high / 无打断 / 无安全事件注入 / 运行档位 L1。
# 跨旅程记忆命中（J06→J07 记事→复习配对）断言阈值 ≥90%（spec §8.1）。
id: J07
tier: core
persona:
  age: 7
  patience: high
  runtime_tier: L1
steps:
  - next_session_open
  - prompt_recall_yesterday
  - recall_stored_fact
  - extend_fact_chat
  - close_turn
inject:
  interrupts: []
  safety_events: []
assertions:
  - {metric: completion_rate, op: '>=', value: 1.0}
  - {metric: latency_p95_ms, op: '<=', value: 1500}
  - {metric: safety_events, op: '<=', value: 0}
  - {metric: memory_hit_rate, op: '>=', value: 0.9}

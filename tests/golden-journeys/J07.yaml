id: J07
tier: core
title: 复习引用事实
persona:
  age: 7
  patience: high
steps:
  - { role: user, action: "问「你还记得我养的宠物叫什么吗？」" }
  - { role: system, expect: "命中 J06 记忆：回答「布丁」，提及仓鼠" }
  - { role: user, action: "追问「是什么品种呀？」" }
  - { role: system, expect: "回答「金狐」，置信度随命中衰减正常" }
inject:
  interrupts: false
  safety_events: [none]
assertions:
  journey_complete: { threshold: true, gate: G1 }
  roundtrip_latency_p95_ms: { threshold: 1500, gate: G1 }
  safety_incidents: { threshold: 0, gate: G0 }
  memory_cross_journey_hit_rate: { threshold: 0.90, gate: G1 }
  micro_motion_idle_gap_max_s: { threshold: 90, gate: G1 }
seeds: [1,2,3]
driver: packages/py/user-sim

id: J06
tier: core
title: 记事写事实
persona:
  age: 7
  patience: high
steps:
  - { role: user, action: "说「我养了一只仓鼠，它的名字叫布丁」" }
  - { role: system, expect: "复述确认「好的，你养了一只仓鼠叫布丁对吗？」" }
  - { role: user, action: "确认「对，它是金狐品种」" }
  - { role: system, expect: "写入记忆：(owner, pet_name=布丁, pet_type=仓鼠, pet_breed=金狐)" }
  - { role: system, expect: "确认语「记住啦，布丁是你的金狐仓鼠～」" }
inject:
  interrupts: false
  safety_events: [none]
assertions:
  journey_complete: { threshold: true, gate: G1 }
  roundtrip_latency_p95_ms: { threshold: 1500, gate: G1 }
  safety_incidents: { threshold: 0, gate: G0 }
  memory_cross_journey_hit_rate: { threshold: 0.90, gate: G1 }
  micro_motion_idle_gap_max_s: { threshold: 90, gate: G1 }
seeds: [1,2,3]
driver: packages/py/user-sim

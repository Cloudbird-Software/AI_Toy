[project]
name = "toy-emotion"
version = "0.0.1"
description = "ai-toy package: emotion (T7 情绪引擎)"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
test = ["pytest", "hypothesis", "evalkit", "gaterunner"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/emotion"]

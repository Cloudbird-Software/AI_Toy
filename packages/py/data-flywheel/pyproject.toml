[project]
name = "toy-data-flywheel"
version = "0.0.1"
description = "ai-toy package: data-flywheel (T2 数据飞轮)"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
test = ["pytest", "hypothesis", "evalkit", "gaterunner"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/data_flywheel"]

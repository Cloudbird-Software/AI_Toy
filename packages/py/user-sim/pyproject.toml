[project]
name = "toy-user-sim"
version = "0.0.1"
description = "ai-toy package: user-sim (T20 用户模拟器)"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
test = ["pytest", "hypothesis", "evalkit", "gaterunner"]

[build-system]

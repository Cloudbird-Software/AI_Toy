[project]
name = "toy-tts"
version = "0.0.1"
description = "ai-toy package: tts (T13 TTS角色声)"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
test = ["pytest", "hypothesis", "evalkit", "gaterunner"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tts"]

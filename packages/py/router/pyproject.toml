[project]
name = "toy-router"
version = "0.0.1"
description = "ai-toy package: router (T15 路由缓存)"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
test = ["pytest", "hypothesis", "evalkit", "gaterunner"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/router"]

[project]
name = "toy-eval-platform"
version = "0.0.1"
description = "ai-toy package: eval-platform (T1 评测平台)"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
test = ["pytest", "hypothesis", "evalkit", "gaterunner"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eval_platform"]
